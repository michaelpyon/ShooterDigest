<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e12"/>
      <stop offset="1" stop-color="#11171d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1c2630" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- accent bar -->
  <rect x="80" y="232" width="56" height="6" rx="3" fill="url(#accent)"/>

  <!-- crosshair mark -->
  <g transform="translate(996, 110)" stroke="#34d399" stroke-width="6" fill="none" opacity="0.9">
    <circle cx="60" cy="60" r="52"/>
    <line x1="60" y1="0" x2="60" y2="30"/>
    <line x1="60" y1="90" x2="60" y2="120"/>
    <line x1="0" y1="60" x2="30" y2="60"/>
    <line x1="90" y1="60" x2="120" y2="60"/>
    <circle cx="60" cy="60" r="6" fill="#34d399" stroke="none"/>
  </g>

  <text x="80" y="190" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#5b6b78" letter-spacing="6">WEEKLY BRIEFING</text>

  <text x="78" y="330" font-family="Inter, Arial, sans-serif" font-size="116" font-weight="800" fill="#f5f7fa" letter-spacing="-3">ShooterDigest</text>

  <text x="80" y="400" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" fill="#aab6c0">Weekly competitive shooter intelligence</text>

  <!-- mini leaderboard rows -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="456" width="1040" height="54" rx="6" fill="#151c23" stroke="#1f2933"/>
    <text x="104" y="490" font-size="26" font-weight="600" fill="#e6ebf0">1  Counter-Strike 2</text>
    <text x="1006" y="490" font-size="26" font-weight="700" fill="#34d399">92.4</text>

    <rect x="80" y="520" width="1040" height="54" rx="6" fill="#151c23" stroke="#1f2933"/>
    <text x="104" y="554" font-size="26" font-weight="600" fill="#e6ebf0">2  Valorant</text>
    <text x="1006" y="554" font-size="26" font-weight="700" fill="#34d399">89.7</text>
  </g>
</svg>
